name: Build OPPO K3 (SDM710 - ReSukiSU)

on:
  workflow_call:
  workflow_dispatch:

env:
  # ⚠️ 设备信息
  DEVICE_NAME : "oppo_k3"
  DEVICE_CODENAME : "PCGM00"

  CUSTOM_CMDS : ""
  EXTRA_CMDS : ""

  # ⚠️ 内核源码（你 Fork 的仓库）
  KERNEL_SOURCE : "https://github.com/hfjxjdb/LawRun_realme_sdm710.git"
  KERNEL_BRANCH : "master"

  CLANG_SOURCE : ""
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "lineage-19.1"
  GCC_32_SOURCE : "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "lineage-19.1"

  DEFCONFIG_SOURCE: ""
  # ⚠️ 你的配置文件名称
  DEFCONFIG_NAME : "sdm710-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # ⚠️ 切换为 ReSukiSU
  KERNELSU_SOURCE : "https://github.com/Yakayna/ReSukiSU.git"
  KERNELSU_BRANCH : "main"

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu" # 如果 Action 不支持这个关键词，会自动从上面拉取源码

  # ⚠️ SUSFS 设置（如果编译失败，请临时改为 false）
  SUSFS_ENABLE : true
  SUSFS_FIXED : false

  # ⚠️ AK3 打包模板
  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "coloros_11" # 你的系统版本

  # Other env
  PYTHON_VERSION: "2"

  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  # ⚠️ 补丁源（留空）
  PATCHES_SOURCE: "" 
  PATCHES_BRANCH: "" 

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: "syscall" # 4.9 内核推荐用 syscall

  # ⚠️ KPM 配置（核心需求）
  KPM_ENABLE: true 
  KPM_INLINE: true 
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom" 

  BUILD_DEBUGGER: "false" 
  # 核心救命选项：跳过所有打不上的补丁，防止卡在 ksud.c
  SKIP_PATCH: "true" 

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/lahaina_QGKI.config"

  FREE_MORE_SPACE: "false" 

jobs:
  build-kernel:
    name: OPPO K3 (SDM710)
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        run: |
          # Needn't manual hook.

      - name: 🪛 Extra Kernel Options
        run: |
          # 1. 为 ReSukiSU 开启 syscall 挂钩
          cd $GITHUB_WORKSPACE/device_kernel
          echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=y" >> ./arch/arm64/configs/sdm710-perf_defconfig
          
          # 2. AnyKernel3 自动同步版本，适配 ColorOS 11 (Android 11)
          sed -i '/^\. tools\/ak3-core\.sh;/a \
          \
          patch_os_version() {\
            ui_print " " "Syncing OS version and patch level...";\
            local prop="/product/build.prop";\
            local TARGET_VER="";\
            local TARGET_PATCH="";\
            if [ -f "$prop" ]; then\
              TARGET_VER=$(file_getprop "$prop" ro.build.version.release);\
              TARGET_PATCH=$(file_getprop "$prop" ro.build.version.security_patch | grep -oE '\''^[0-9]{4}-[0-9]{2}'\'');\
            else\
              ui_print "- Warning: $prop not found!";\
            fi\
            if [ -f "$SPLITIMG/header" ]; then\
              if [ -n "$TARGET_VER" ] && [ -n "$TARGET_PATCH" ]; then\
                ui_print "- Updating header: OS $TARGET_VER (Patch: $TARGET_PATCH)";\
                sed -i "s/^os_version=.*/os_version=$TARGET_VER/" "$SPLITIMG/header";\
                sed -i "s/^os_patch_level=.*/os_patch_level=$TARGET_PATCH/" "$SPLITIMG/header";\
              else\
                ui_print "- Warning: Could not find valid version/patch info in $prop.";\
              fi\
            else\
              ui_print "- Warning: header file not found, skipped.";\
            fi\
          }' AnyKernel3/anykernel.sh
          
          sed -i 's/^dump_boot;.*/&\n\npatch_os_version;/' AnyKernel3/anykernel.sh
          
          # K3 对应 ColorOS 11 (Android 11)，版本号改为 11.0.0
          sed -i 's/^supported\.versions=.*/supported.versions=11.0.0/' AnyKernel3/anykernel.sh

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
